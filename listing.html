
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programme - Pohjanpiha Festival</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="programme.js"></script>
</head>
<body>
    <header>
        <h1>Festival Programme</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="listing.html">Programme</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Explore the festival gigs</h2>

        <p>Discover artists, stages and performance times.
            Star your favourite gigs to create your own programme.
        </p>

        <div class="filter-controls" role="group"
            aria-label="Filter programme by stage">

            <button type="button" data-stage="all"
                aria-pressed="true">All stages</button>

            <button type="button" data-stage="Pihalava"
                aria-pressed="false">Pihalava</button>

            <button type="button" data-stage="Rantalava"
                aria-pressed="false">Rantalava</button>

            <button type="button" data-stage="Navetta"
                aria-pressed="false">Navetta</button>

        </div>

        <div class="star-filter">
            <label for="starred-only">
                <input type="checkbox" id="starred-only"
                    name="starred-only">
                Show only starred gigs
            </label>
        </div>

        <p id="programme-status" role="status">
            Loading programme...
        </p>

        <ul id="programme-list" class="programme-list">
        </ul>

        <button type="button" id="show-more" hidden>
            Show more
        </button>

        <button type="button" id="retry-button" hidden>
            Try again
        </button>

        <noscript>
            <p>Please enable JavaScript to view the festival programme.</p>
        </noscript>

    </main>

    <footer>
        <p>© Pohjanpiha Festival</p>
    </footer>
</body>
</html>
