<main>
    <h2>Contact Us</h2>
    <p>Have questions about accessibility or the festival? Contact us!</p>

    <form onsubmit="event.preventDefault(); document.getElementById('result').textContent='Your question is ready to send!';">
        <label>Name:</label>
        <input type="text" required>

        <label>Email:</label>
        <input type="email" required>

        <label>Your Question:</label>
        <textarea required></textarea>

        <button type="submit">Submit</button>
    </form>

    <p id="result" role="status"></p>
</main>
