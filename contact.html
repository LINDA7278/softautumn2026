<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Pohjanpiha Festival</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
    <header>
<h1>Contact Us</h1>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="listing.html">Programme</a>
<a href="contact.html">Contact</a>
</nav>
</header>
 
    <main>
<h2>Ask us a question</h2>
 
        <form id="form">
<label for="name">Name:</label>
<input type="text" id="name" name="name" required>
 
            <label for="email">Email:</label>
<input type="email" id="email" name="email" required>
 
            <label for="question">Question:</label>
<textarea id="question" name="question" required minlength="5"></textarea>
 
            <button type="submit">Submit</button>
</form>
 
        <p id="message"></p>
</main>
 
    <script>

        document.getElementById("form").onsubmit = function(event) {

            event.preventDefault();
 
            document.getElementById("message").textContent =

                "Your question is ready! It has not been sent yet.";

        };
</script>
 
    <footer>
<p>© Pohjanpiha Festival</p>
</footer>
 
</body>
</html>
