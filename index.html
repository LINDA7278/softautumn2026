<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasers and Feelings Tool</title>
</head>
<body>
    <div>
        <button onClick="throwDice();" type="button">Throw</button>
        <p>Result: </p>
    </div>
 
    <script>
        function throwDice() {
            let result = Math.floor((Math.random() * 6) + 1);
            document.getElementById("result").innerText = result;
        }
    </script>
</body>
</html>
